<!DOCTYPE html>
<html>
<head>
    <title>混乱网页</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            animation: glitch 0.3s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0); }
        }
        .rain {
            position: fixed;
            top: -100%;
            font-size: 24px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { top: 100vh; }
        }
    </style>
</head>
<body>
    <h1>10086 混乱系统</h1>
    <div id="output"></div>
    <script>
        // 混乱的JS
        const chaos = {
            init: () => {
                console.log("系统启动");
                this.rain();
                this.randomText();
            },
            rain: () => {
                setInterval(() => {
                    const drop = document.createElement('div');
                    drop.className = 'rain';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.textContent = String.fromCharCode(0x4E00 + Math.random() * 0x9FFF);
                    document.body.appendChild(drop);
                    setTimeout(() => drop.remove(), 5000);
                }, 100);
            },
            randomText: () => {
                setInterval(() => {
                    const el = document.getElementById('output');
                    el.textContent = Math.random().toString(36).substr(2, 10);
                }, 50);
            }
        };
        chaos.init();
    </script>
</body>
</html>
